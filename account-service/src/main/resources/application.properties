spring.application.name=account-service
server.port=8081

# ── Datasource ────────────────────────────────────────────────────────────────
# Named in-memory H2 database. DB_CLOSE_DELAY=-1 keeps it alive for the
# lifetime of the JVM rather than closing after the last connection drops.
spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ── H2 Console (dev only) ─────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Structured JSON logging (ECS format) ──────────────────────────────────────
# Emits one JSON object per line. Fields included automatically:
#   @timestamp, log.level, service.name (from spring.application.name),
#   log.logger, message — plus any MDC keys (e.g. traceId).
logging.structured.format.console=ecs
