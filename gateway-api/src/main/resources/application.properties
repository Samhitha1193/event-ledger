spring.application.name=gateway-api
server.port=8080

# ── Datasource (own H2, separate from account-service) ───────────────────────
spring.datasource.url=jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ── H2 Console (dev only) ─────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Actuator ──────────────────────────────────────────────────────────────────
# base-path moved off / so springdoc can register at /v3/api-docs without conflict.
# GET /health is served by the custom HealthController at the root path instead.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ── Tracing (OpenTelemetry via Micrometer) ────────────────────────────────────
management.tracing.sampling.probability=1.0

# ── Structured JSON logging (ECS format) ──────────────────────────────────────
logging.structured.format.console=ecs

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Account Service client ────────────────────────────────────────────────────
account.service.url=http://localhost:8081
account.service.connect-timeout-ms=2000

# ── Resilience4j — Circuit Breaker ───────────────────────────────────────────
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true

# ── Resilience4j — Time Limiter (per-call timeout) ───────────────────────────
resilience4j.timelimiter.instances.accountService.timeout-duration=5s
resilience4j.timelimiter.instances.accountService.cancel-running-future=true

# ── Resilience4j — Aspect ordering ───────────────────────────────────────────
# @Retry is outermost so it sees raw exceptions before @CircuitBreaker or
# @TimeLimiter can intercept them. Neither CB nor TL carry a fallbackMethod;
# @Retry is the sole terminal error handler.
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.timelimiter.time-limiter-aspect-order=3

# ── Resilience4j — Retry (exponential backoff + jitter) ──────────────────────
# Only 5xx server errors are retried; 4xx client errors (e.g. 422) are not.
resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=500ms
resilience4j.retry.instances.accountService.enable-exponential-backoff=true
resilience4j.retry.instances.accountService.exponential-backoff-multiplier=2
resilience4j.retry.instances.accountService.exponential-max-wait-duration=10s
resilience4j.retry.instances.accountService.randomized-wait-factor=0.5
resilience4j.retry.instances.accountService.retry-exceptions=org.springframework.web.client.HttpServerErrorException
