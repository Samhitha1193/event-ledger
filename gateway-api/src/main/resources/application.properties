spring.application.name=gateway-api
server.port=8080

# ── Datasource (own H2, separate from account-service) ───────────────────────
spring.datasource.url=jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ── H2 Console (dev only) ─────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Actuator ──────────────────────────────────────────────────────────────────
# base-path moved off / so springdoc can register at /v3/api-docs without conflict.
# GET /health is served by the custom HealthController at the root path instead.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Tracing (OpenTelemetry via Micrometer) ────────────────────────────────────
management.tracing.sampling.probability=1.0

# ── Structured JSON logging (ECS format) ──────────────────────────────────────
logging.structured.format.console=ecs

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Account Service client ────────────────────────────────────────────────────
account.service.url=http://localhost:8081
account.service.connect-timeout-ms=2000

# ── Resilience4j — Circuit Breaker ───────────────────────────────────────────
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true

# ── Resilience4j — Time Limiter (per-call timeout) ───────────────────────────
resilience4j.timelimiter.instances.accountService.timeout-duration=5s
resilience4j.timelimiter.instances.accountService.cancel-running-future=true
