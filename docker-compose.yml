services:

  account-service:
    build: ./account-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway-api:
    build: ./gateway-api
    ports:
      - "8080:8080"
    environment:
      - ACCOUNT_SERVICE_URL=http://account-service:8081
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
